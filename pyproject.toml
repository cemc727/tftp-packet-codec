[project]
name = "tftp-packet-codec"
version = "0.1.2"
description = "Implements RFC 1350 TFTP packet serialization for read, write, data, ack, and error types"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
